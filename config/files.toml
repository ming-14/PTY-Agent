# 文件工具配置 —— file read/write/edit/grep/glob 子命令
# 加载入口：src/config/files.py（FILES_* 常量）
# 说明：
#   - 读限制、写限制、搜索限制与忽略目录清单
#   - RG_EXE 为空时自动探测 bin/rg/rg.exe（项目根）与 PATH

[files]
MAX_READ_SIZE = 262144          # file read 单文件大小上限（250KB）
DEFAULT_READ_LIMIT = 2000       # file read 默认读取行数
MAX_LINE_LENGTH = 2000          # 单行超过此长度截断显示
MAX_PATH_LEN = 4096             # 路径参数长度上限
MAX_CONTENT_LEN = 1048576       # file write/edit 内容参数长度上限
MAX_GREP_MATCHES = 100          # file grep 返回匹配文件数上限
MAX_GLOB_FILES = 100            # file glob 返回文件数上限
RG_EXE = ""                     # rg 可执行文件路径；空 = 自动探测
IGNORED_DIRS = [                # 搜索忽略的目录名（路径任意段命中即跳过）
    ".git", ".opencode", ".idea", ".vscode", "node_modules", "vendor",
    "dist", "build", "target", "__pycache__", "bin", "obj", "out",
    "coverage", "tmp", "temp", "logs", "generated",
]

# ── 文件传输（file upload/download）──
TRANSFER_CHUNK_SIZE = 262144       # 传输数据帧大小（256KB）
TRANSFER_MAX_FILES = 100000        # 单次传输条目数上限（目录树防御）
TRANSFER_MAX_CONTROL = 16777216    # 控制帧 payload 上限（16MB，清单/计划）
TRANSFER_MAX_SIZE = 0              # 单文件大小上限；0 = 无限制
TRANSFER_TMP_SUFFIX = ".pty-tmp"   # 传输临时文件后缀
TRANSFER_PROGRESS_INTERVAL = 60    # 非 TTY 强制进度打印间隔（秒）
TRANSFER_TIMEOUT = 120             # file upload/download 默认总时限（秒）
