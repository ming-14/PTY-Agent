# 守护进程配置 —— 仅 Daemon 进程使用的常量
# Web 配置 → web.toml（由 Daemon 启动 Web 服务）
# 日志配置 → logging.toml

[network]
DEFAULT_DAEMON_PORT = 18765

[buffer]
MAX_OUTPUT_BUFFER = 104_857_600   # 100 MB
MAX_TRIGGER_SCAN  = 1_048_576     # 1 MB

[timeout]
DEFAULT_TRIGGER_TIMEOUT = 120.0
DAEMON_START_TIMEOUT    = 3.0
PING_TIMEOUT            = 1.0
STOP_TIMEOUT            = 3.0

[misc]
SOCKET_LISTEN_BACKLOG  = 5
SOCKET_RECV_BUFSIZE    = 4096
PTY_READ_SIZE          = 65536
MAX_MESSAGE_LENGTH     = 1_048_576   # 1 MB

[daemon_start]
DAEMON_START_POLL_INTERVAL    = 0.3
PROCESS_EXIT_WAIT_RETRIES     = 10
PROCESS_EXIT_WAIT_INTERVAL    = 0.1

[named_resource]
SINGLE_INSTANCE_MUTEX_NAME = "Local\\PTYAgentSingleInstance"
JOB_OBJECT_NAME_PREFIX     = "Local\\PTYJob_"

[input_limit]
MAX_SESSIONS = 50

[shared_memory]
MMAP_NAME = "Local\\PTYAgentDaemon"
MMAP_SIZE = 32

[auth]
AUTH_TOKEN_NAME             = "Local\\PTYAgentAuth"
AUTH_TOKEN_SIZE             = 64
AUTH_TOKEN_ROTATE_INTERVAL  = 1800
AUTH_TOKEN_GRACE_PERIOD     = 120
HMAC_KEY_NAME               = "Local\\PTYAgentHmac"
HMAC_KEY_SIZE               = 64

# TLS 服务端配置（ENABLE_PUBKEY_AUTH=true 时生效）
# pubkey Listener 使用 TLS 传输，daemon 首次启动自动生成自签证书
PUBKEY_LISTEN_HOST     = "0.0.0.0"                                    # TLS Listener 监听地址（跨机访问需 0.0.0.0）
PUBKEY_LISTEN_PORT     = 18767                                        # TLS Listener 监听端口
TLS_CERT_DIR           = "~/.pty-agent/certs"                         # 证书存储目录
TLS_CERT_FILE          = "~/.pty-agent/certs/daemon.crt"              # 证书文件路径
TLS_KEY_FILE           = "~/.pty-agent/certs/daemon.key"              # 私钥文件路径
TLS_CERT_VALIDITY_DAYS = 365                                          # 证书有效期（天）
TLS_CERT_SUBJECT_CN    = "pty-agent-daemon"                           # 证书 Common Name
