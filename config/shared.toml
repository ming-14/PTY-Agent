# 共享配置 —— Daemon 与 Client 均需使用的常量（协议 / IPC / daemon 控制）
#
# 消费方：
# - 协议域（src/protocol）：消息收发缓冲与上限
# - IPC 域（src/ipc）：共享内存、单实例锁命名与尺寸
# - daemon 控制（src/daemonctl）：端口发现、启动/停止超时与轮询
# - 日志格式/归档/异步队列 → config/logging.toml（跨侧共享）

[protocol]
SOCKET_RECV_BUFSIZE = 65536
# 消息总大小上限。需大于 workflow 定义文件上限（20MB）经 JSON 序列化 +
# 信封/凭证/签名后的体积（UTF-8 非 ASCII 会转义膨胀），留足余量防止
# 协议层先于 workflow 层拦截大定义文件。
MAX_MESSAGE_LENGTH  = 50_331_648   # 48 MB

[ipc]
SINGLE_INSTANCE_MUTEX_NAME = "Local\\PTYAgentSingleInstance"
AUTH_TOKEN_NAME = "Local\\PTYAgentAuth"
AUTH_TOKEN_SIZE = 64
HMAC_KEY_NAME   = "Local\\PTYAgentHmac"
HMAC_KEY_SIZE   = 64

[daemonctl]
# daemon 启动/停止/探测相关（client 侧控制能力）
DAEMON_START_TIMEOUT       = 10.0
DAEMON_START_POLL_INTERVAL = 0.3
PING_TIMEOUT               = 1.0
STOP_TIMEOUT               = 3.0
PROCESS_EXIT_WAIT_RETRIES  = 10
PROCESS_EXIT_WAIT_INTERVAL = 0.1
