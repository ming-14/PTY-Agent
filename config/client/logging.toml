# 客户端日志配置 — client 侧专属
#
# 消费方：src/config/client.py
# 跨侧共享配置（格式/归档/异步）→ config/logging.toml

[level]
# 客户端日志级别：DEBUG / INFO / WARNING / ERROR / None（不落盘）
CLIENT_LOG_LEVEL = "DEBUG"

[loggers]
# pty-auth：keygen 等本地命令经 src/auth/keys.py 使用 auth 域 logger，
# 需在 client 侧注册，否则 get_logger 告警"日志可能丢失"且日志确实不落盘
CLIENT_LOGGERS = ["pty-client", "pty-daemonctl", "pty-auth"]
