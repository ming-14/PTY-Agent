<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>xterm-resize-live</title></head>
<body>
<div id="term" style="width:900px;height:600px;background:#000"></div>
<pre id="result" style="display:none"></pre>
<script src="../src/web/static/vendor/xterm/xterm.js"></script>
<script>
  // live 测试：真实 xterm 复现 resize 行为（ttyd 式：不重建 scrollback，
  // xterm 自身 reflow + 后端 snapshot 更新可见区）。
  // 双模式：
  //   A. 注入模式：run-xterm-repro.js 注入 window.__DATA（daemon 收集的
  //      resize_complete 数据，{steps:[{cols,rows,scrollback,snapshot}]}）
  //      → 模拟前端 rebuild（\x1b[3J + scrollback + \r\n + snapshot）
  //   B. 自包含模式：无 __DATA → 内置模拟（写输出 → resize → snapshot）
  const term = new Terminal({ cols: 80, rows: 20, scrollback: 10000, fontSize: 14 });
  term.open(document.getElementById('term'));

  function stripAnsi(s) {
    return s.replace(/\x1b\[[0-9;?]*[a-zA-Z]|\x1b\][^\x07]*\x07/g, '');
  }

  function dump(t, tag) {
    const buf = t.buffer.active;
    const lines = [];
    for (let i = 0; i < buf.length; i++) {
      const l = buf.getLine(i);
      if (!l) continue;
      const txt = l.translateToString(true).trimEnd();
      if (txt) lines.push(txt);
    }
    // 拆分残留：行尾空格 + 下一行行首空格
    let splitResidue = 0;
    for (let i = 0; i < lines.length - 1; i++) {
      if (lines[i].endsWith(' ') && lines[i + 1].startsWith(' ')) splitResidue++;
    }
    // 关键行完整性
    const kimi = lines.filter(l => l.indexOf('__rikka_kimi') >= 0);
    const pi = lines.filter(l => l.indexOf('__rikka_pi') >= 0);
    const cn = lines.filter(l => l.indexOf('35 个文件') >= 0);
    return {
      tag, cols: t.cols, rows: t.rows,
      bufLines: buf.length, lines: lines.length,
      splitResidue,
      kimi: kimi.slice(0, 2), pi: pi.slice(0, 2), cn: cn.slice(0, 2),
      tail5: lines.slice(-5),
    };
  }

  const results = [];
  let step = 0;
  let data = null;

  function makeOutput() {
    let out = '';
    for (let i = 0; i < 60; i++) {
      out += '2026/08/' + String((i % 28) + 1).padStart(2, '0') + '  ' +
        String(i).padStart(2, '0') + ':00    <DIR>          dir_' + String(i).padStart(3, '0') + '\r\n';
    }
    out += '2026/08/23  13:45    <DIR>          __rikka_atomcode\r\n';
    out += '2026/08/20  11:26    <DIR>          __rikka_crush\r\n';
    out += '2026/08/23  14:28    <DIR>          __rikka_kimi\r\n';
    out += '2026/08/23  13:53    <DIR>          __rikka_pi\r\n';
    out += '              35 个文件        460,630 字节\r\n';
    out += '              90 个目录 132,911,558,656 可用字节\r\n';
    out += 'C:\\Users\\rikka>';
    return out;
  }

  function makeSnapshot(cols, rows) {
    // 模拟后端 snapshot（可见区最后 rows 行 + 提示符）
    const all = makeOutput().split('\r\n');
    const vis = all.slice(-rows);
    let snap = '';
    vis.forEach((l, i) => { snap += '\x1b[' + (i + 1) + ';1H' + l; });
    return snap;
  }

  function next() {
    step++;
    document.getElementById("result").textContent = 'STEP' + step;
    if (data) {
      // 注入模式：依次模拟前端 rebuild（\x1b[3J + scrollback + R-1 换行 + snapshot）
      const s = data.steps[step - 1];
      if (!s) { document.getElementById("result").textContent = JSON.stringify(results, null, 1); return; }
      term.resize(s.cols, s.rows);
      const scrollbackLines = s.scrollback ? s.scrollback.split('\r\n') : [];
      if (scrollbackLines.length && scrollbackLines[scrollbackLines.length - 1] === '') scrollbackLines.pop();
      const parts = [];
      for (const line of scrollbackLines) { parts.push(line); parts.push('\r\n'); }
      for (let i = 0; i < term.rows - 1; i++) parts.push('\r\n');
      term.write('\x1b[3J\x1b[2J\x1b[1;1H' + parts.join('') + '\x1b[2J' + (s.snapshot || ''), () => {
        results.push(dump(term, 'step' + s.cols + 'x' + s.rows));
        next();
      });
      return;
    }
    // 自包含模式
    if (step === 1) {
      term.write(makeOutput(), () => {
        results.push(dump(term, 'initial80'));
        next();
      });
    } else if (step === 2) {
      term.resize(30, 7);
      results.push(dump(term, 'afterResize30'));
      next();
    } else if (step === 3) {
      term.write('\x1b[2J\x1b[1;1H' + makeSnapshot(30, 7), () => {
        results.push(dump(term, 'afterSnapshot30'));
        next();
      });
    } else if (step === 4) {
      term.resize(80, 20);
      results.push(dump(term, 'afterResize80'));
      next();
    } else if (step === 5) {
      term.write('\x1b[2J\x1b[1;1H' + makeSnapshot(80, 20), () => {
        results.push(dump(term, 'afterSnapshot80'));
        document.getElementById("result").textContent = JSON.stringify(results, null, 1);
      });
    }
  }

  // CDP 注入 __DATA 后调用 start()
  window.start = function () {
    data = window.__DATA || null;
    results.length = 0;
    step = 0;
    next();
  };
  window.start();
</script>
</body>
</html>
