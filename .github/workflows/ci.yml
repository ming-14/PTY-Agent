# PTY-Agent CI：自动安装环境 → 自动构建发布包 → 自动跑全量测试
#
# 矩阵：Windows（完整构建：下载 wezterm-py/fastscreen/win-sandbox + 构建 rime + 下载工具）
#       Linux（下载 wezterm-py + 构建 rime + 下载工具；Windows 专属组件自动跳过）
#
# 关键点：
# - 先跑 BUILD.py（下载二进制到 bin/），再跑 pytest，
#   保证 web e2e / attend e2e 的 _HAS_WEZTERM 为真、能真实运行而非跳过
# - pip + npm 均做缓存，缩短重复构建时间
# - BUILD.py 步骤失败仅告警不中断（下载源偶发不可达时构建仍能完成）

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node (rime webpack)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_rime/plugin/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # 其余组件（wezterm-py / fastscreen / win-sandbox / aichat / rg 等）
      # 均由 BUILD.py 从 GitHub Releases 或 PyPI 下载，无需额外编译工具链。
      # Windows runner 自带 VS 工具链；Linux 上 Windows 专属组件自动跳过。

      - name: Install Python deps (runtime + test)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout pytest-asyncio httpx websockets

      - name: Build release package
        run: python BUILD.py
        shell: bash

      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-agent-${{ matrix.os }}
          path: pty-agent-*.zip
          if-no-files-found: ignore
