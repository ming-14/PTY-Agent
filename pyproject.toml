[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pty-agent"
version = "1.1.0"
description = "命令行交互式程序交互代理：通过 subprocess 管道或真实终端（TTY）与交互式 CLI 程序双向通信"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["pty", "terminal", "cli", "agent", "subprocess"]

# 运行时依赖：pyte（终端仿真，pty 模式）；其余为 Python 3.11+ 标准库
dependencies = [
    "pyte>=0.8.2",
]

[project.optional-dependencies]
# 测试依赖：pytest-timeout 给会起真实子进程的用例兜底超时
#   用法：python -m pytest test/ -q --timeout=60
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
]

[project.scripts]
pty-agent = "pty_agent.__main__:main"

[project.urls]
Repository = "https://github.com/ming-14/PTY-Agent"

[tool.setuptools.packages.find]
where = ["src"]
