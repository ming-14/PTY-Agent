# =============================================================================
# win_sandbox Python 包构建配置
# =============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "win-sandbox"
version = "0.2.0"
description = "Windows Sandbox - sandboxed process execution via Low IL token + Job Object"

requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "win-sandbox contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

# 无第三方依赖（仅标准库 + ctypes）
dependencies = []

[project.urls]
Homepage = "https://github.com/ming-14/win-sandbox"
Source = "https://github.com/ming-14/win-sandbox"

[project.optional-dependencies]
dev = []

# =============================================================================
# 构建配置
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["win_sandbox"]

[tool.hatch.build.targets.wheel.force-include]
# pybind11 扩展（in-process 动态库）
# glob 匹配任意 Python ABI tag（cp310/cp311/cp312/...），
# 避免硬编码 cp311 导致其他版本构建的 .pyd 无法入包
"../build/bin/win_sandbox_native.*.pyd" = "win_sandbox/_native/"

# =============================================================================
# hatchling 构建钩子：构建前编译 C++ 项目
# =============================================================================
# [tool.hatch.build.hooks.custom]
# 当前不自动编译，依赖外部构建流程