# 客户端配置 —— 仅 Client 进程使用的常量

[timeout]
CONNECT_TIMEOUT         = 30.0
DEFAULT_TRIGGER_TIMEOUT = 120.0

[auth]
# TLS 客户端配置（CLIENT_AUTH_METHOD=pubkey 跨机模式时生效）
# DAEMON_REMOTE_HOST 非空时启用跨机 TLS 连接，空则使用同机 SHM 发现
DAEMON_REMOTE_HOST  = ""                                              # 远程 daemon 主机地址（空=同机 SHM，非空=跨机 TLS）
DAEMON_REMOTE_PORT  = 18767                                           # 远程 daemon TLS 端口
KNOWN_HOSTS_FILE    = "~/.pty-agent/known_hosts"                      # TOFU 信任存储文件
TOFU_STRICT         = true                                            # TOFU 严格模式（true=指纹不匹配拒绝，false=仅警告）
