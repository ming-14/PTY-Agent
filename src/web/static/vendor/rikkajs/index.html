<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shimeji 桌宠 - Web 版</title>
  <link rel="stylesheet" href="shimeji.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 300vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .hero h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
    .hero p { font-size: 1.2rem; opacity: 0.9; max-width: 600px; line-height: 1.6; }
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2147483646;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .controls button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover { background: rgba(255,255,255,0.35); }
    .controls button:active { background: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Shimeji 桌宠</h1>
    <p>Web 版本 - 拖拽它、看它走来走去、坐下、攀爬墙壁、从天花板掉下来...</p>
    <p style="margin-top:1rem;opacity:0.7;font-size:0.9rem;">向下滚动查看更多空间</p>
  </div>

  <div class="controls">
    <button id="btn-add">增加一只</button>
    <button id="btn-gather">集合！</button>
    <button id="btn-one">只留一只</button>
    <button id="btn-remove">移除全部</button>
  </div>

  <script src="shimeji.js"></script>
  <script>
    const manager = Shimeji.create({ maxCount: 10 });
    manager.addMascot();
    manager.start();

    document.getElementById('btn-add').addEventListener('click', () => manager.addMascot());
    document.getElementById('btn-gather').addEventListener('click', () => manager.gatherAll());
    document.getElementById('btn-one').addEventListener('click', () => manager.remainOne());
    document.getElementById('btn-remove').addEventListener('click', () => manager.disposeAll());
  </script>
</body>
</html>
