[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastscreen"
version = "0.1.0"
description = "High-performance screen capture engine with DXGI/WGC/BitBlt support"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
web = [
    "aiohttp>=3.9",
    "av>=12.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["fastscreen*"]
exclude = ["tests*", "web*", "gui*"]

[tool.setuptools.package-data]
fastscreen = ["*.dll"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
